<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mathematica project folder for Thomas Valenzuela's portfolio.">
  <title>Mathematica Projects | Thomas Valenzuela</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c232b;
      --muted: #5f6872;
      --surface: rgba(255, 255, 255, 0.86);
      --line: rgba(44, 51, 58, 0.16);
      --accent-dark: #0b4f4a;
      --shadow: 0 22px 60px rgba(24, 32, 42, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background: #e9e5dc url("../../assets/mathBackground.png") center top / cover fixed no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(247, 245, 238, 0.86);
      pointer-events: none;
    }

    .page {
      width: min(900px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 48px 0;
      display: grid;
      align-content: center;
      gap: 22px;
    }

    .back-link {
      justify-self: start;
      min-height: 42px;
      color: var(--accent-dark);
      font-weight: 850;
      text-decoration: none;
    }

    .panel {
      padding: clamp(28px, 5vw, 48px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent-dark);
      font-weight: 850;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(2.8rem, 7vw, 5.2rem);
      line-height: 1.08;
    }

    p {
      max-width: 650px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../../#projects">Back to portfolio</a>

    <section class="panel">
      <p class="eyebrow">Mathematica Projects</p>
      <h1>Under Construction</h1>
      <p>No Mathematica projects are posted here yet.</p>
    </section>
  </main>
</body>
</html>
